# REVIEW COPY ONLY. Install at .github/workflows/yingxu-cached-release.yml.
# Add this workflow and helper using [skip ci]; do not enable before authorization.
name: YingXu explicit cached-runtime release
on:
  workflow_dispatch:
    inputs:
      approve_download_and_publish:
        description: 'Approve one run with up to 500 MiB downloads and publish Windows 0.4.22 workflow.1'
        type: boolean
        required: true
        default: false
      source_commit:
        description: 'Exact reviewed main commit SHA; must match this dispatch ref'
        type: string
        required: true
  push:
    branches: [main]
    paths: ['.github/release-requests/yingxu-0.4.22.json']
permissions:
  contents: write
concurrency:
  group: yingxu-portable-release
  cancel-in-progress: false
jobs:
  windows:
    if: >-
      github.repository == 'NOXEVYR/yingxu' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && inputs.approve_download_and_publish == true && inputs.source_commit == github.sha) ||
       (github.event_name == 'push' && github.event.head_commit.message == 'release: YingXu 0.4.22 cached runtime [cloud-approved-500MiB]'))
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Use existing runner tools only
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in 'git','python','node','gh','curl.exe') { Get-Command $tool -ErrorAction Stop | Out-Null }
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Check capture layout before downloading release inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $sources = @('Core.cs','Integration.cs','Capture.cs','CaptureTests.cs') | ForEach-Object { (Resolve-Path -LiteralPath (Join-Path 'desktop' $_)).Path }
          & $compiler /nologo /optimize+ /platform:x64 /utf8output /target:exe /out:capture-preflight.exe /reference:System.dll /reference:System.Core.dll /reference:System.Web.Extensions.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll @sources
          if ($LASTEXITCODE) { throw 'Capture preflight compilation failed; no runtime downloaded' }
          $test = Start-Process (Join-Path $PWD 'capture-preflight.exe') -WindowStyle Hidden -PassThru -RedirectStandardOutput 'capture-preflight.log' -RedirectStandardError 'capture-preflight-error.log'
          if (-not $test.WaitForExit(60000)) { $test.Kill(); throw 'Capture preflight timed out; no runtime downloaded' }
          Get-Content capture-preflight.log
          Get-Content capture-preflight-error.log
          if ($test.ExitCode -ne 0) { throw 'Capture preflight failed; no runtime downloaded' }
      - name: Check platform version labels before downloading release inputs
        run: |
          node tests/frontend_macos.cjs
          if ($LASTEXITCODE) { throw 'Platform version checks failed; no runtime downloaded' }
      - name: Authenticate explicit request and reuse verified official runtime
        run: |
          python -B .github/release-support/cached_release.py prepare
          if ($LASTEXITCODE) { throw 'Cached release preparation failed' }
      - name: Backend and available frontend regressions
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YINGXU_INSTALLER_TEST_RUNTIME = Join-Path $PWD 'runtime'
          & ./runtime/python.exe -B -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Backend tests failed' }
          node --check frontend/app.js
          if ($LASTEXITCODE) { throw 'Frontend syntax failed' }
          # prepare requires these unchanged source tests AND editor/build inputs
          # to match the verified 0.4.20 baseline. No npm download is permitted.
          $sourceOnly = @('frontend_live_markdown.cjs','frontend_live_tables.cjs','frontend_markdown_links.cjs','frontend_obsidian_images.cjs')
          foreach ($test in Get-ChildItem tests/frontend_*.cjs) {
            if ($sourceOnly -contains $test.Name) {
              Write-Output "NOT RUN ON CLOUD: $($test.Name) requires development dependencies; unchanged-source gate verified"
              continue
            }
            node $test.FullName
            if ($LASTEXITCODE) { throw "Frontend tests failed: $($test.Name)" }
          }
      - name: Build native host and verify complete package
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'yingxu-cached-release/webview2.nupkg'
          python -B desktop/build.py --sdk-package $sdk --output YingXu.exe --test
          if ($LASTEXITCODE) { throw 'Native build or tests failed' }
          python -B tools/package_release.py
          if ($LASTEXITCODE) { throw 'Package build failed' }
          $report = python -B tools/verify_release.py releases/YingXu-v0.4.22-Windows-x64.zip
          if ($LASTEXITCODE) { throw 'Complete package verification failed' }
          [IO.File]::WriteAllText((Join-Path $PWD 'releases/YingXu-v0.4.22-verification.json'),($report -join "`n")+"`n",[Text.UTF8Encoding]::new($false))
      - name: Upload draft and compare GitHub digests before publishing
        run: |
          python -B .github/release-support/cached_release.py publish
          if ($LASTEXITCODE) { throw 'Publication failed; retain draft and uploaded assets for inspection' }

  candidate_native_verification:
    if: >-
      github.repository == 'NOXEVYR/yingxu' &&
      github.ref == 'refs/heads/codex/yingxu-0.4.23-verification' &&
      inputs.approve_download_and_publish == false && inputs.source_commit == github.sha
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare fresh official inputs for disposable verification
        run: |
          python -B .github/release-support/prepare_native_verification.py
          if ($LASTEXITCODE) { throw 'Pinned preparation failed' }
      - name: Build and run all native synthetic checks
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'yingxu-candidate-verify/webview2.nupkg'
          python -B desktop/build.py --sdk-package $sdk --output YingXu.exe --test 1> native-stdout.txt 2> native-stderr.txt
          $nativeExit = $LASTEXITCODE
          Get-Content native-stdout.txt -Tail 20
          if ($nativeExit) { Get-Content native-stderr.txt; throw 'Native verification failed' }
          $record = @{source_commit=$env:GITHUB_SHA; version='0.4.23'; build_revision='workflow.4'; exit_code=$nativeExit}
          [IO.File]::WriteAllText((Join-Path $PWD 'native-result.json'),($record | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yingxu-0.4.23-native-verification
          path: |
            YingXu.exe
            desktop/build.json
            native-result.json
            native-preparation.json
            native-stdout.txt
            native-stderr.txt
          if-no-files-found: error
