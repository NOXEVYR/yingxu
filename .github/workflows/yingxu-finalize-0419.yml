name: Finalize verified YingXu 0.4.19 draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yingxu-finalize-0419.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: yingxu-portable-release
  cancel-in-progress: false
jobs:
  finalize:
    if: >-
      github.repository == 'NOXEVYR/yingxu' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish verified 0.4.19 draft without rebuilding'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify existing draft and publish by release ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('expected.json').write_bytes(base64.b64decode(''))
          Path('finalize.py').write_bytes(base64.b64decode(''))
          PY
          python3 -B finalize.py
