name: YingXu explicitly approved macOS preview
on:
  push:
    branches: [main]
    paths: ['.github/release-requests/yingxu-0.4.20.json']
  workflow_dispatch:
    inputs:
      approve_download_and_publish:
        description: 'Approve one Mac build/download verification and publication'
        type: boolean
        required: true
        default: false
      source_commit:
        description: 'Exact reviewed main source SHA'
        type: string
        required: true
      mac_download_budget_mib:
        description: 'Approved Mac download budget, including ZIP readback'
        type: choice
        options: ['300']
        required: true
permissions:
  contents: write
concurrency:
  group: yingxu-macos-preview
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'NOXEVYR/yingxu' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && inputs.approve_download_and_publish == true && inputs.source_commit == github.sha) ||
       (github.event_name == 'push' && github.event.head_commit.message == 'release: YingXu 0.4.20 cached runtime [cloud-approved-800MiB]'))
    runs-on: macos-14
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      YINGXU_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify approval and absent destination before dependencies
        run: python3 -B .github/release-support/macos_release.py preflight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned build inputs
        run: |
          python -m venv .release-work/build-env
          echo "$PWD/.release-work/build-env/bin" >> "$GITHUB_PATH"
          .release-work/build-env/bin/python -B macos/prepare_dependencies.py
      - name: Prepare locked editor test inputs
        working-directory: tools/markdown-editor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Backend and frontend regressions
        run: |
          python -B -m unittest discover -s tests -v
          node --check frontend/app.js
          test -x "$YINGXU_TEST_BROWSER"
          for test in tests/frontend_*.cjs; do node "$test"; done
      - name: Native checks and isolated build
        run: |
          python -B macos_app.py --smoke-test
          python -B macos/build.py
          python -B macos/verify_release.py releases/macos-preview/YingXu-v0.4.20-mac.1-macOS-arm64.zip --output releases/macos-preview/YingXu-v0.4.20-mac.1-verification.json
      - name: Upload, read back and verify before publishing
        run: python -B .github/release-support/macos_release.py publish
