# Independent repository: release builds follow explicit version/workflow changes.
name: YingXu portable release
on:
  workflow_dispatch:
    inputs:
      replace_icons:
        description: 'Explicitly replace 0.4.6 icon repair assets; retain tag and roll back on failure'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/yingxu-portable.yml'
      - 'yingxu/__init__.py'
permissions:
  contents: write
concurrency:
  group: yingxu-portable-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified build inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          python tools/prepare_runtime.py --cache "$env:RUNNER_TEMP/runtime-cache" --download
          if ($LASTEXITCODE) { throw 'Runtime preparation failed' }
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4191.47/microsoft.web.webview2.1.0.4191.47.nupkg' -OutFile "$env:RUNNER_TEMP/webview2.nupkg"
      - name: Build local Markdown editor bundle
        working-directory: tools/markdown-editor
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Markdown editor dependency installation failed' }
          npm run build
          if ($LASTEXITCODE) { throw 'Markdown editor bundle build failed' }
      - name: Build offline canvas editor
        # The publication-only retry reuses the committed, verified canvas bundle.
        if: "github.event_name != 'push' || github.event.head_commit.message != 'fix: replace 0.4.6 icons [viewfinder-v1] [windows-only]'"
        working-directory: tools/canvas-editor
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global pnpm@11.20.0 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Pinned canvas package manager failed' }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { throw 'Canvas dependency installation failed' }
          node build.mjs
          if ($LASTEXITCODE) { throw 'Offline canvas build failed' }
      - name: Backend and frontend regression tests
        run: |
          # Synthetic fixtures use canonical paths, including Windows short TEMP paths.
          # Worker coalescing tests synchronize their bursts; runner disk speed must not change their assertions.
          # Standalone headless DOM fixtures use installed Edge; fixed WebView2 is tested through its native host below.
          & ./runtime/python.exe -B -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Backend tests failed' }
          node --check frontend/app.js
          if ($LASTEXITCODE) { throw 'Frontend syntax failed' }
          foreach ($test in Get-ChildItem tests/frontend_*.cjs) {
            node $test.FullName
            if ($LASTEXITCODE) { throw "Frontend tests failed: $test" }
          }
      - name: Desktop and fixed browser tests
        run: |
          python desktop/build.py --sdk-package "$env:RUNNER_TEMP/webview2.nupkg" --output YingXu.exe --test
          if ($LASTEXITCODE) { throw 'Desktop tests failed' }
      - name: Build and verify complete offline ZIP
        run: |
          python tools/package_release.py
          if ($LASTEXITCODE) { throw 'Package failed' }
          python tools/verify_release.py releases/YingXu-v0.4.8-Windows-x64.zip | Tee-Object releases/YingXu-v0.4.8-verification.json
          if ($LASTEXITCODE) { throw 'Release verification failed' }
      - name: Upload draft, fetch and verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          ICON_REPAIR_PUSH: "${{ github.event_name == 'push' && github.repository == 'turnsolesama/yingxu' && github.ref == 'refs/heads/main' && (github.event.head_commit.message == 'fix: replace 0.4.6 icons [viewfinder-v1]' || github.event.head_commit.message == 'fix: replace 0.4.6 icons [viewfinder-v1] [windows-only]') && 'true' || 'false' }}"
          REPLACE_ICONS: "${{ ((github.event_name == 'workflow_dispatch' && inputs.replace_icons) || (github.event_name == 'push' && github.repository == 'turnsolesama/yingxu' && github.ref == 'refs/heads/main' && (github.event.head_commit.message == 'fix: replace 0.4.6 icons [viewfinder-v1]' || github.event.head_commit.message == 'fix: replace 0.4.6 icons [viewfinder-v1] [windows-only]'))) && 'true' || 'false' }}"
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'yingxu-v0.4.8'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          $taskExistingDraft = $false
          $taskReplaceIcons = $false
          $taskIconRequest = $env:REPLACE_ICONS -eq 'true' -and ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:ICON_REPAIR_PUSH -eq 'true'))
          if ($LASTEXITCODE -eq 0) {
            $taskIsDraft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
            if ($taskIsDraft -eq 'true' -and $taskIconRequest) {
              throw 'Explicit icon replacement does not modify drafts'
            }
            if ($taskIsDraft -ne 'true') {
              if ($taskIconRequest) { $taskReplaceIcons = $true }
              else { Write-Output 'Published release preserved'; exit 0 }
            }
            if (-not $taskReplaceIcons) {
            $taskTagSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha
            if ($LASTEXITCODE -or $taskTagSha -ne $env:GITHUB_SHA) { throw 'Draft tag differs from this verified source commit; preserve it for review' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title '映序 0.4.8 · 启动提速与创作交互改进'
            if ($LASTEXITCODE) { throw 'Draft title refresh failed' }
            $taskExistingDraft = $true
            }
          }
          if ($taskIconRequest -and -not $taskReplaceIcons) {
            throw 'Explicit icon replacement requires an existing published Windows release'
          }
          @'
          完整解压后双击 YingXu.exe。自带锁定 Python、Pillow、FFmpeg 和 WebView2，无新增依赖或模型。

          - Windows 启动先快速检查空端口，后台服务与 WebView2 并行初始化，减少重复连接等待；服务身份、版本和退出检查保持有效。
          - SKILL 首次扫描移到后台，项目与分类信息并行读取，让工作台更早可用；保留扫描预算、失败提示和原有功能。
          - 新项目继承项目库当前选中的分类，项目与归属一起保存；创建成功后刷新失败可重试显示，不会重复创建项目。
          - 图片预览支持按住鼠标中键拖动位置，保留原有缩放操作。
          - 弹窗标题和关闭按钮固定在滚动内容外，长列表中仍可直接关闭。
          - Markdown 实时预览支持表格，表格单元可定位回源码编辑，保留原始文稿与输入法状态。
          - Windows 截图提供矩形、箭头、Shift 画直线、马赛克和桌面置顶；工具栏改用图标与色板，支持撤销、确认和取消。

          本次附件为 Windows x64 0.4.8；macOS M 系列试用包独立验证，下载请查看本仓库对应 macOS 发布页。

          更新前保存文稿，从托盘退出映序，运行旧目录Stop-YingXu.ps1，再完整解压新版。保留原项目和应用数据目录。发布附件经过完整下载、SHA-256与隔离运行验证；历史版本保留。
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/release-notes.md"
          if ($taskReplaceIcons) {
            python -B macos/publish.py --replace-windows-icons "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE) { throw 'Verified icon replacement failed; see rollback report' }
            exit 0
          }
          if ($taskExistingDraft) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE) { throw 'Draft notes refresh failed' }
            gh release upload $tag releases/YingXu-v0.4.8-Windows-x64.zip releases/YingXu-v0.4.8-SHA256.txt releases/YingXu-v0.4.8-manifest.json releases/YingXu-v0.4.8-verification.json --repo $env:GITHUB_REPOSITORY --clobber
          } else {
          gh release create $tag releases/YingXu-v0.4.8-Windows-x64.zip releases/YingXu-v0.4.8-SHA256.txt releases/YingXu-v0.4.8-manifest.json releases/YingXu-v0.4.8-verification.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title '映序 0.4.8 · 启动提速与创作交互改进' --notes-file "$env:RUNNER_TEMP/release-notes.md" --draft
          }
          if ($LASTEXITCODE) { throw 'Draft upload failed' }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP/published-check"
          if ($LASTEXITCODE) { throw 'Draft download failed' }
          $manifest = Get-Content "$env:RUNNER_TEMP/published-check/YingXu-v0.4.8-manifest.json" -Raw | ConvertFrom-Json
          $zip = Get-Item "$env:RUNNER_TEMP/published-check/YingXu-v0.4.8-Windows-x64.zip"
          if ($zip.Length -ne $manifest.bytes -or (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() -ne $manifest.sha256) { throw 'Downloaded asset differs' }
          python tools/verify_release.py $zip.FullName
          if ($LASTEXITCODE) { throw 'Downloaded asset failed verification' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { throw 'Verified Windows release publication failed' }
          Write-Output 'Windows release downloaded, verified, and published.'
