name: YingXu Windows and macOS release candidates
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact reviewed commit SHA of the selected ref; build and verify only'
        type: string
        required: true
      platform:
        description: 'Platforms to build and verify'
        type: choice
        options:
          - both
          - windows
          - macos
        default: both
        required: true
permissions:
  contents: read
concurrency:
  group: yingxu-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: >-
      github.repository == 'NOXEVYR/yingxu' &&
      inputs.source_commit == github.sha &&
      (inputs.platform == 'both' || inputs.platform == 'windows')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      YINGXU_TEST_BROWSER: 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare locked runtime and SDK
        run: |
          # The original Gyan archive URL expired. This official mirror serves the
          # same pinned bytes; prepare_runtime.py still checks the source lock.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/runtime-cache" | Out-Null
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip' -OutFile "$env:RUNNER_TEMP/runtime-cache/ffmpeg.zip"
          python -B tools/prepare_runtime.py --cache "$env:RUNNER_TEMP/runtime-cache" --download
          if ($LASTEXITCODE) { throw 'Runtime preparation failed' }
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4191.47/microsoft.web.webview2.1.0.4191.47.nupkg' -OutFile "$env:RUNNER_TEMP/webview2.nupkg"
      - name: Build locked Markdown test inputs
        working-directory: tools/markdown-editor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Markdown dependencies failed' }
          npm run build
          if ($LASTEXITCODE) { throw 'Markdown build failed' }
      - name: Run backend and all frontend regressions
        run: |
          $env:YINGXU_INSTALLER_TEST_RUNTIME = "$PWD/runtime"
          & ./runtime/python.exe -B -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Backend regressions failed' }
          node --check frontend/app.js
          if ($LASTEXITCODE) { throw 'App syntax failed' }
          node --check frontend/xmind-editor.js
          if ($LASTEXITCODE) { throw 'XMind syntax failed' }
          if (!(Test-Path $env:YINGXU_TEST_BROWSER)) { throw 'Chromium test browser missing' }
          foreach ($test in Get-ChildItem tests/frontend_*.cjs) {
            node $test.FullName
            if ($LASTEXITCODE) { throw "Frontend regression failed: $test" }
          }
      - name: Compile native host and verify final ZIP
        run: |
          python -B desktop/build.py --sdk-package "$env:RUNNER_TEMP/webview2.nupkg" --output YingXu.exe --test
          if ($LASTEXITCODE) { throw 'Native build or tests failed' }
          python -B tools/package_release.py
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          $version = (& ./runtime/python.exe -B -c 'from yingxu import __version__; print(__version__)').Trim()
          if ($LASTEXITCODE) { throw 'Version unavailable' }
          python -B tools/verify_release.py "releases/YingXu-v$version-Windows-x64.zip" > "releases/YingXu-v$version-verification.json"
          if ($LASTEXITCODE) { throw 'Final ZIP verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: YingXu-Windows-x64-${{ github.sha }}
          path: |
            releases/YingXu-v*-Windows-x64.zip
            releases/YingXu-v*-manifest.json
            releases/YingXu-v*-SHA256.txt
            releases/YingXu-v*-verification.json
          if-no-files-found: error
          retention-days: 14
  macos:
    if: >-
      github.repository == 'NOXEVYR/yingxu' &&
      inputs.source_commit == github.sha &&
      (inputs.platform == 'both' || inputs.platform == 'macos')
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      YINGXU_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare locked Apple Silicon build environment
        run: |
          python -m venv .release-work/build-env
          echo "$PWD/.release-work/build-env/bin" >> "$GITHUB_PATH"
          .release-work/build-env/bin/python -B macos/prepare_dependencies.py
      - name: Build locked Markdown test inputs
        working-directory: tools/markdown-editor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Run backend regressions
        run: |
          python -B -m unittest discover -s tests -v
      - name: Run frontend regressions
        run: |
          node --check frontend/app.js
          node --check frontend/xmind-editor.js
          test -x "$YINGXU_TEST_BROWSER"
          for test in tests/frontend_*.cjs; do node "$test"; done
      - name: Build and verify final Apple Silicon ZIP
        run: |
          python -B macos_app.py --smoke-test
          python -B macos/build.py
          version=$(python -B -c 'from yingxu import __mac_preview__; print(__mac_preview__)')
          python -B macos/verify_release.py "releases/macos-preview/YingXu-v$version-macOS-arm64.zip" --output "releases/macos-preview/YingXu-v$version-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: YingXu-macOS-arm64-${{ github.sha }}
          path: releases/macos-preview/*
          if-no-files-found: error
          retention-days: 14
